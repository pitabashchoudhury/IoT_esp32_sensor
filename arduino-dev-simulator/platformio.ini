; =============================================================
;  IoT Dev Simulator - Arduino + Ethernet Shield
;  Generates random sensor data and publishes via MQTT
;  Compatible with iot-backend device-service topics
; =============================================================

[env:mega_ethernet]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    arduino-libraries/Ethernet@^2.0.2

; --- Hardware ---
; Arduino Mega 2560 + Ethernet Shield (W5100 or W5500)
; Connect Ethernet shield on top of Mega, plug in LAN cable.
; The shield uses SPI pins (50-53 on Mega) automatically.

; Upload settings (adjust for your system)
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
